<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SplitPay" />
    <meta name="description" content="Local-first shared expense splitting and balance ledger" />
    <title>SplitPay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var isLocalhost = Boolean(
          window.location.hostname === 'localhost' ||
          window.location.hostname === '[::1]' ||
          window.location.hostname.match(/^127(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}$/) ||
          window.location.port === '5173' ||
          window.location.port === '5174'
        );

        if ('serviceWorker' in navigator) {
          if (isLocalhost) {
            // Unregister any active service worker on dev localhost to clear stale bundle chunk caches
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                for (var j = 0; j < keys.length; j++) {
                  caches.delete(keys[j]);
                }
              }).catch(function() {});
            }
          } else if (window.location.protocol.startsWith('http')) {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('/sw.js').catch(function() {});
            });
          }
        }
      })();
    </script>
  </body>
</html>
